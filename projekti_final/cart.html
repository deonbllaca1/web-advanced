<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Cart | VERTEX</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav>

        <a href="index.html">Home</a>

        <a href="men.html">Men</a>

        <a href="women.html">Women</a>

        <a href="about.html">About Us</a>

        <a href="cart.html">Cart</a>

    </nav>



    <main style="padding: 50px; text-align: center; color: white;">

        <h1 style="color: #d4af37;">YOUR CART</h1>

       

        <div id="cart-section" style="max-width: 600px; margin: 0 auto; background: rgba(25, 25, 25, 0.8); padding: 30px; border-radius: 8px;">

           

            <div class="cart-item" style="display: flex; justify-content: space-between; padding: 20px 0; border-bottom: 1px solid #333;">

                <span>ACQUA DI GIO DARK - €120</span>

                <button type="button" id="remove-btn"

                        style="background: #a72828; color: white; border: none; padding: 5px 10px; cursor: pointer;">

                    REMOVE

                </button>

            </div>



            <h2 id="total-text" style="margin-top: 30px;">TOTAL: €120</h2>

           

            <button onclick="alert('Thank you for your purchase!')"

                    style="background: #28a745; color: white; border: none; padding: 15px 40px; cursor: pointer; width: 100%; margin-top: 20px;">

                PROCEED TO CHECKOUT

            </button>

        </div>

    </main>



    <script>

        document.getElementById('remove-btn').addEventListener('click', function() {

            // This removes the item row

            const item = document.querySelector('.cart-item');

            item.remove();

           

            // This updates the total to zero

            document.getElementById('total-text').innerText = 'TOTAL: €0';

           

            alert('Item removed!');

        });

    </script>

</body>

</html>
