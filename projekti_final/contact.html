<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us | VERTEX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #0a0a0a; color: white; font-family: Arial, sans-serif;">

    <nav>
        <a href="index.html">Home</a>
        <a href="men.html">Men</a>
        <a href="women.html">Women</a>
        <a href="about.html">About Us</a>
        <a href="cart.html">Cart</a>
    </nav>


 <main style="max-width: 600px; margin: 50px auto; padding: 20px; background: #1a1a1a; border-radius: 8px;">
        <h1 style="color: #d4af37; text-align: center;">CONTACT US</h1>
        <p style="text-align: center;">Have a question? Fill out the form below.</p>

        <!-- Use an action link to send to your email via a free service like Formspree -->
        <form action="https://formspree.io/f/YOUR_EMAIL_ID_HERE" method="POST">
            
            <label style="display: block; margin-top: 15px;">Name:</label>
            <input type="text" name="name" required style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: none;">

            <label style="display: block; margin-top: 15px;">Email:</label>
            <input type="email" name="email" required style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: none;">

            <label style="display: block; margin-top: 15px;">Message:</label>
            <textarea name="message" rows="5" required style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: none;"></textarea>

            <button type="submit" style="background: #d4af37; color: black; border: none; padding: 15px 30px; margin-top: 20px; cursor: pointer; width: 100%; font-weight: bold; border-radius: 4px;">
                SEND MESSAGE
            </button>
        </form>
    </main>
</body>
</html>
